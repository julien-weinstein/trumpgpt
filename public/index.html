<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>TrumpGPT</title>
<style>
:root{--bg:#0d1117;--surface:#161c26;--line:#262f3d;--text:#ececec;--muted:#8b95a5;--gold:#e8b75a;--red:#c8323a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px;padding-top:env(safe-area-inset-top);background:rgba(13,17,23,.92);backdrop-filter:blur(8px)}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand span{color:var(--red)}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--surface);color:var(--text)}

main{max-width:760px;margin:0 auto;padding:8px 16px 160px}

.empty{min-height:calc(100dvh - 240px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.empty h1{margin:0;font:900 clamp(34px,9vw,52px)/1.05 Georgia,"Times New Roman",serif;color:var(--gold)}
.empty h1 span{color:var(--red)}
.empty p{margin:0;color:var(--muted);font-size:15px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;width:100%;max-width:560px}
.chips button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.35;color:#cfd6e0}
.chips button:hover{background:var(--surface)}
.stat{margin-top:16px;font-size:12px;color:#5f6b7c}

.turn{margin:22px 0}
.user{display:flex;justify-content:flex-end}
.user div{max-width:85%;background:var(--surface);padding:10px 16px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font:900 12px/28px Georgia,serif;text-align:center;margin-top:2px}
.reply{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.reply.typing:empty::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.reply.typing:not(:empty)::after{content:"▍";color:var(--gold);animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{opacity:.2}}
.err{color:#ff8b8b}
details{margin-top:8px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;list-style:none;display:inline-block}
summary::-webkit-details-marker{display:none}
details p{margin:8px 0;padding-left:10px;border-left:2px solid var(--line);white-space:normal;line-height:1.5}

.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px 0;max-height:180px}
textarea::placeholder{color:#6b7686}
.send{flex:none;width:38px;height:38px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.send:disabled{opacity:.3;cursor:default}
.mic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.mic[hidden]{display:none}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.mic.wait{opacity:.5}
.icon.on{color:var(--gold)}
#voice .mute{display:inline}#voice .wave{display:none}
#voice.on .mute{display:none}#voice.on .wave{display:inline}
.actions{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.actions details{margin:0}
.listen{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;padding:0}
.listen.playing{color:var(--gold)}
.fine{max-width:760px;margin:6px auto 0;text-align:center;font-size:11px;color:#5f6b7c}
@media(max-width:600px){.avatar{display:none}}
@media(max-width:420px){.chips{grid-template-columns:1fr}.chips button:nth-child(n+4){display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Trump<span>GPT</span></div>
  <div style="display:flex;gap:2px">
  <button class="icon" id="voice" type="button" aria-label="Read replies aloud" title="Read replies aloud">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 5a10 10 0 0 1 0 14"/><path class="mute" d="m22 9-6 6M16 9l6 6"/></svg>
  </button>
  <button class="icon" id="reset" type="button" aria-label="New chat" title="New chat">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  </div>
</header>

<main id="chat"></main>

<div class="dock">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
    <button class="mic" id="mic" type="button" aria-label="Talk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>
    </button>
    <button class="send" id="send" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </form>
  <div class="fine">TrumpGPT is AI satire. It makes things up, just like the real thing.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');
const SUGGESTIONS = [
  "What's going on in the news this week?",
  'Can I take Tylenol if I’m pregnant?',
  "Who's your biggest enemy right now?",
  'How do I make sourdough bread?',
  'Honestly, you lost in 2020',
  'Write a Truth Social post about my roommate',
];
let history = [], busy = false, stats = null;

const scrollDown = () => window.scrollTo({ top: document.body.scrollHeight });

function emptyState() {
  const el = document.createElement('div');
  el.className = 'empty';
  el.innerHTML = '<h1>Trump<span>GPT</span></h1><p>Go ahead. Make it quick, I\'m running the country.</p><div class="chips"></div><div class="stat"></div>';
  for (const s of SUGGESTIONS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.onclick = () => submit(s);
    el.querySelector('.chips').append(b);
  }
  if (stats) el.querySelector('.stat').textContent =
    `Built on ${(stats.spoken + stats.posts).toLocaleString()} of his real speeches, interviews & posts · current to ${stats.latest}`;
  return el;
}

function addUser(text) {
  const t = document.createElement('div');
  t.className = 'turn user';
  const d = document.createElement('div');
  d.textContent = text;
  t.append(d);
  chat.append(t);
}

function addBot() {
  const t = document.createElement('div');
  t.className = 'turn bot';
  t.innerHTML = '<div class="avatar">DJT</div><div style="flex:1;min-width:0"><div class="reply typing"></div></div>';
  chat.append(t);
  return { wrap: t.lastChild, body: t.querySelector('.reply') };
}

function addActions(wrap, reply, sources) {
  const row = document.createElement('div');
  row.className = 'actions';
  const listen = document.createElement('button');
  listen.type = 'button';
  listen.className = 'listen';
  listen.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span>Listen</span>';
  listen.onclick = () => speak(reply, listen);
  row.append(listen);
  if (sources) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = 'Sources ›';
    d.append(s);
    for (const x of sources) {
      const p = document.createElement('p');
      p.textContent = `${x.d} · ${x.g === 'truth' ? 'Truth Social' : x.g}: “${x.t}${x.t.length >= 280 ? '…' : ''}”`;
      d.append(p);
    }
    row.append(d);
  }
  wrap.append(row);
  return listen;
}

// --- Voice -----------------------------------------------------------------
// One shared <audio> element, unlocked during a tap, so iPhones will let it
// play replies that arrive later without another tap.
const player = new Audio();
player.playsInline = true;
// 0.1 s of silence as a WAV data URL.
const SILENT = (() => {
  const n = 800, buf = new DataView(new ArrayBuffer(44 + n));
  const str = (o, t) => [...t].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); buf.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
  buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
  buf.setUint32(24, 8000, true); buf.setUint32(28, 8000, true); buf.setUint16(32, 1, true); buf.setUint16(34, 8, true);
  str(36, 'data'); buf.setUint32(40, n, true);
  for (let i = 0; i < n; i++) buf.setUint8(44 + i, 128);
  return 'data:audio/wav;base64,' + btoa(String.fromCharCode(...new Uint8Array(buf.buffer)));
})();
let unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  player.src = SILENT;
  player.play().catch(() => { unlocked = false; });
}
document.addEventListener('pointerdown', unlockAudio, { capture: true });

let voiceOn = false, playingBtn = null, speakToken = 0;
function setVoice(on) {
  voiceOn = on;
  $('voice').classList.toggle('on', on);
  try { localStorage.setItem('voice', on ? '1' : ''); } catch {}
  if (!on) stopSpeaking();
}
function stopSpeaking() {
  speakToken++;
  player.pause();
  if (playingBtn) { playingBtn.classList.remove('playing'); playingBtn.querySelector('span').textContent = 'Listen'; }
  playingBtn = null;
}
async function speak(text, btn) {
  if (btn && btn === playingBtn) return stopSpeaking();
  stopSpeaking();
  const token = speakToken;
  playingBtn = btn;
  if (btn) { btn.classList.add('playing'); btn.querySelector('span').textContent = 'Loading…'; }
  try {
    const res = await fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
    });
    if (!res.ok) throw Error((await res.json().catch(() => ({}))).error || 'Voice failed');
    const url = URL.createObjectURL(await res.blob());
    if (token !== speakToken) return URL.revokeObjectURL(url);
    player.src = url;
    player.onended = () => { URL.revokeObjectURL(url); if (token === speakToken) stopSpeaking(); };
    if (btn) btn.querySelector('span').textContent = 'Stop';
    await player.play();
  } catch (err) {
    if (token === speakToken) stopSpeaking();
    console.warn(err);
  }
}

// Mic: tap to record, tap again to send. Talking turns on spoken replies.
let recorder = null;
async function toggleMic() {
  const mic = $('mic');
  if (recorder) return recorder.stop();
  if (busy) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return alert('Microphone access is blocked. Allow it in your browser settings.'); }
  stopSpeaking();
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const type = recorder.mimeType || 'audio/webm';
    recorder = null;
    mic.classList.remove('rec');
    mic.classList.add('wait');
    try {
      const res = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': type }, body: new Blob(chunks, { type }) });
      const data = await res.json();
      if (!res.ok) throw Error(data.error);
      if (data.text.trim()) { setVoice(true); submit(data.text); }
    } catch (err) {
      input.placeholder = err.message || "Couldn't hear that";
    } finally {
      mic.classList.remove('wait');
    }
  };
  recorder.start();
  mic.classList.add('rec');
}

function reset() {
  history = [];
  chat.replaceChildren(emptyState());
  input.value = '';
  resize();
}

function resize() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  sendBtn.disabled = busy || !input.value.trim();
}

async function submit(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  input.value = '';
  resize();
  if (!history.length) chat.replaceChildren();
  addUser(text);
  history.push({ role: 'user', content: text });
  const { wrap, body } = addBot();
  scrollDown();
  let reply = '', sources = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-30) }),
    });
    if (!res.ok) throw Error((await res.json().catch(() => ({}))).error || 'Request failed');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl));
        buf = buf.slice(nl + 1);
        if (msg.sources) sources = msg.sources;
        if (msg.d) {
          const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
          reply += msg.d;
          body.textContent = reply;
          if (atBottom) scrollDown();
        }
        if (msg.error) throw Error(msg.error);
      }
    }
    if (!reply) throw Error('Empty reply');
    history.push({ role: 'assistant', content: reply });
    const listen = addActions(wrap, reply, sources);
    if (voiceOn) speak(reply, listen);
  } catch (err) {
    const e = document.createElement('div');
    e.className = 'err';
    e.textContent = err.message;
    body.after(e);
    if (!reply) history.pop();
    else history.push({ role: 'assistant', content: reply });
  } finally {
    body.classList.remove('typing');
    busy = false;
    resize();
  }
}

$('form').addEventListener('submit', e => { e.preventDefault(); submit(input.value); });
input.addEventListener('keydown', e => {
  // Enter sends on desktop; on phones the return key adds a new line.
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) {
    e.preventDefault();
    submit(input.value);
  }
});
input.addEventListener('input', resize);
$('reset').addEventListener('click', () => { stopSpeaking(); reset(); });
$('voice').addEventListener('click', () => setVoice(!voiceOn));
$('mic').addEventListener('click', toggleMic);
if (!window.MediaRecorder || !navigator.mediaDevices) $('mic').hidden = true;
try { setVoice(localStorage.getItem('voice') === '1'); } catch {}

fetch('/api/status').then(r => r.json()).then(s => {
  stats = s.corpus;
  if (!history.length) reset();
}).catch(() => {});
reset();
</script>
</body>
</html>
