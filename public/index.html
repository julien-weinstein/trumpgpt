<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrumpGPT</title>
<style>
:root{--bg:#0b1425;--panel:#16243b;--line:#33435e;--gold:#f0c56d;--red:#b3262d;--text:#f6f2e8;--muted:#9fb0c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:820px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:12px 16px}
header{text-align:center;padding:8px 0 12px;border-bottom:1px solid var(--line)}
h1{margin:0;font:900 clamp(30px,7vw,48px)/1 Georgia,serif;letter-spacing:2px;color:var(--gold)}
h1 span{color:var(--red)}
.tag{margin:6px 0 0;color:var(--muted);font-size:14px}
.notice{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:12px;color:var(--muted)}
.bar button{background:#24344f;color:var(--text);border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 0 16px}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--red)}
.msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.who{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
.user .who{color:#ffe3d0}
details{margin-top:10px;font-size:12px;color:var(--muted)}
summary{cursor:pointer}
details p{margin:6px 0;padding-left:8px;border-left:2px solid var(--line);white-space:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips[hidden]{display:none}
.chips button{background:#1e2e48;color:#f4dfad;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
form{display:flex;gap:8px;align-items:flex-end;border:1px solid #4b5b77;border-radius:14px;padding:6px;background:#0f1c31}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px;max-height:160px}
.send{background:var(--gold);color:#141c2c;border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}
.send:disabled{opacity:.5;cursor:wait}
footer{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 2px}
.cursor::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
@media(max-width:520px){.msg{max-width:96%}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>★ TRUMP<span>GPT</span> ★</h1>
    <p class="tag">The greatest chatbot in the history of chatbots. Maybe ever.</p>
    <div class="notice">UNOFFICIAL AI PARODY · NOT DONALD TRUMP · NOT AFFILIATED WITH OR ENDORSED BY HIM</div>
  </header>
  <div class="bar"><span id="mode">Connecting…</span><button id="reset" type="button">New chat</button></div>
  <main id="chat" aria-live="polite"></main>
  <div class="chips" id="chips">
    <button type="button">What's going on in the news this week?</button>
    <button type="button">How do I make sourdough bread?</button>
    <button type="button">Who's your biggest enemy right now?</button>
    <button type="button">Write a Truth Social post about my roommate</button>
    <button type="button">Explain black holes</button>
    <button type="button">Honestly, you lost in 2020</button>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask me anything. I know more than anybody." aria-label="Message"></textarea>
    <button class="send" id="send">SEND</button>
  </form>
  <footer>Satire generated by AI from the public record of his speeches, interviews and posts. Don't trust the facts, believe me.</footer>
</div>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');
let history = [], busy = false;

function bubble(role, text = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'YOU' : 'TRUMPGPT';
  const body = document.createElement('div');
  body.textContent = text;
  el.append(who, body);
  chat.append(el);
  chat.scrollTop = chat.scrollHeight;
  return { el, body };
}

function showSources(el, sources) {
  const d = document.createElement('details');
  const s = document.createElement('summary');
  s.textContent = 'Real quotes this reply was styled on';
  d.append(s);
  for (const x of sources) {
    const p = document.createElement('p');
    p.textContent = `${x.d} · ${x.g}: “${x.t}${x.t.length >= 280 ? '…' : ''}”`;
    d.append(p);
  }
  el.append(d);
}

function reset() {
  history = [];
  $('chips').hidden = false;
  chat.replaceChildren();
  bubble('assistant', "Welcome to TrumpGPT. Frankly, the best chatbot ever built. People can't believe how good it is. Other chatbots? Weak. Very low IQ. Go ahead, ask me something. Try not to make it a stupid question.");
  input.focus();
}

async function submit(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = sendBtn.disabled = true;
  input.value = '';
  $('chips').hidden = true;
  bubble('user', text);
  history.push({ role: 'user', content: text });
  const { el, body } = bubble('assistant');
  body.classList.add('cursor');
  let reply = '', sources = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-30) }),
    });
    if (!res.ok) throw Error((await res.json().catch(() => ({}))).error || 'Request failed');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl));
        buf = buf.slice(nl + 1);
        if (msg.sources) sources = msg.sources;
        if (msg.d) { reply += msg.d; body.textContent = reply; chat.scrollTop = chat.scrollHeight; }
        if (msg.error) throw Error(msg.error);
      }
    }
    if (!reply) throw Error('Empty reply');
    history.push({ role: 'assistant', content: reply });
    if (sources) showSources(el, sources);
  } catch (err) {
    body.textContent = (reply ? reply + '\n\n' : '') + '⚠ ' + err.message;
    if (!reply) history.pop();
    else history.push({ role: 'assistant', content: reply });
  } finally {
    body.classList.remove('cursor');
    busy = sendBtn.disabled = false;
    input.focus();
  }
}

$('form').addEventListener('submit', e => { e.preventDefault(); submit(input.value); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(input.value); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
$('chips').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') submit(e.target.textContent); });
$('reset').addEventListener('click', reset);

fetch('/api/status').then(r => r.json()).then(s => {
  $('mode').textContent = s.ready
    ? `● LIVE · ${(s.corpus.spoken + s.corpus.posts).toLocaleString()} real speeches, interviews & posts · current to ${s.corpus.latest}`
    : '● OFFLINE · OPENAI_API_KEY not set on server';
}).catch(() => { $('mode').textContent = '● Server unreachable'; });
reset();
</script>
</body>
</html>
