<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<title>TrumpGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10; --bg-glow:rgba(212,162,76,.10);
  --surface:#12151b; --raised:#181c24; --hover:#1e232d;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
  --text:#ecebe8; --text-2:#b4b8c0; --muted:#7c838f;
  --gold:#d9a94e; --gold-2:#f3d48e;
  --user:#1c2029; --shadow:0 10px 40px -12px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f7f4ee; --bg-glow:rgba(176,124,30,.10);
  --surface:#ffffff; --raised:#ffffff; --hover:#f0ebe1;
  --line:rgba(30,25,15,.08); --line-strong:rgba(30,25,15,.14);
  --text:#1b1a17; --text-2:#4a4740; --muted:#8a857a;
  --gold:#a8761c; --gold-2:#c9952f;
  --user:#ece6da; --shadow:0 10px 40px -14px rgba(60,40,10,.25),0 2px 6px rgba(60,40,10,.08);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(ellipse at 50% 0,var(--bg-glow),transparent 65%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

/* Header */
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-inner{max-width:820px;margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--serif);letter-spacing:.2px}
.brand em{font-style:normal;background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.seal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,#f3d48e,#d9a94e 70%);color:#1a1408;font:800 15px/1 var(--serif);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.25)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--text)}

main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:4px 20px 200px}

/* Welcome */
.welcome{min-height:calc(100dvh - 300px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 0;animation:rise .5s ease both}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--text-2);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:#3fbf6f;box-shadow:0 0 0 3px rgba(63,191,111,.18)}
.welcome h1{margin:22px 0 10px;font:800 clamp(34px,8.5vw,56px)/1.08 var(--serif);letter-spacing:-.5px}
.welcome h1 em{font-style:italic;background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.welcome p{margin:0;max-width:440px;color:var(--muted);font-size:15.5px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:620px;margin-top:34px}
.card{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 85%,transparent);transition:transform .15s,border-color .15s,background .15s}
.card:hover{transform:translateY(-2px);border-color:var(--line-strong);background:var(--raised)}
.card b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}
.card span{display:block;margin-top:3px;font-size:13px;line-height:1.4;color:var(--muted)}

/* Conversation */
.turn{margin:28px 0;animation:rise .25s ease both}
.turn.user{display:flex;justify-content:flex-end}
.turn.user .bubble{max-width:82%;background:var(--user);padding:11px 17px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.turn.bot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px}
.turn.bot .seal{width:28px;height:28px;font-size:14px;margin-top:2px}
.text{font-size:16.5px;color:var(--text);overflow-wrap:anywhere}
.text p{margin:0 0 14px;white-space:pre-wrap}
.text p:last-child{margin-bottom:0}
.dots{display:inline-flex;gap:5px;padding:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.caret p:last-child::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--gold);animation:blink 1s steps(1) infinite}
.error{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14px;color:#ff9b9b;background:rgba(199,59,66,.12);border:1px solid rgba(199,59,66,.25)}
.actions{display:flex;align-items:center;gap:2px;margin-top:10px;margin-left:-8px}
.act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.act:hover{background:var(--hover);color:var(--text)}
.act svg{width:15px;height:15px}
.sources{margin:10px 0 0;display:none}
.sources.open{display:block;animation:rise .2s ease both}
.src{margin:0 0 8px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--text-2)}
.src small{display:block;margin-bottom:3px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}

/* Composer */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 18px;border-radius:26px;background:var(--raised);border:1px solid var(--line-strong);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--gold) 55%,var(--line-strong));box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--gold) 14%,transparent)}
textarea{flex:1;min-height:40px;max-height:200px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.5;padding:8px 0}
textarea::placeholder{color:var(--muted)}
.send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#1a1408;background:linear-gradient(180deg,#f3d48e,#d9a94e);box-shadow:0 2px 10px -2px rgba(217,169,78,.6);transition:transform .12s,opacity .15s,filter .15s}
.send:hover{filter:brightness(1.06)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.35;box-shadow:none;cursor:default}
.send .stop{display:none}
.send.busy .arrow{display:none}.send.busy .stop{display:block}
.fine{max-width:760px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}
.jump{position:fixed;left:50%;bottom:118px;z-index:6;transform:translate(-50%,8px);opacity:0;pointer-events:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-strong);box-shadow:var(--shadow);color:var(--text-2);transition:opacity .2s,transform .2s}
.jump.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  main{padding:4px 16px 190px}
  .turn.bot{display:block}
  .turn.bot > .seal{display:none}
  .cards{grid-template-columns:1fr;gap:8px;margin-top:28px}
  .card:nth-child(n+5){display:none}
  .welcome{min-height:calc(100dvh - 260px)}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <div class="brand"><span class="seal">T</span><span>Trump<em>GPT</em></span></div>
    <button class="icon-btn" id="reset" type="button" aria-label="New chat" title="New chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
    </button>
  </div>
</header>

<main id="chat"></main>

<button class="jump" id="jump" type="button" aria-label="Scroll to bottom">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
</button>

<div class="dock">
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Ask him anything…" aria-label="Message"></textarea>
    <button class="send" id="send" aria-label="Send" disabled>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      <svg class="stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
    </button>
  </form>
  <div class="fine">TrumpGPT is AI satire. It makes things up, just like the real thing.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');
const SUGGESTIONS = [
  ['The news', "What's going on this week?"],
  ['Health advice', 'Can I take Tylenol while pregnant?'],
  ['Enemies list', "Who's your biggest enemy right now?"],
  ['Push his buttons', 'Honestly, you lost in 2020'],
  ['Kitchen help', 'How do I make sourdough bread?'],
  ['Ghostwriting', 'Write a Truth Social post about my roommate'],
];
const ICONS = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
  quote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.2-.8-2-2-2H4c-1.2 0-2 .8-2 2v6c0 1.2.8 2 2 2h3"/><path d="M15 21c3 0 7-1 7-8V5c0-1.2-.8-2-2-2h-4c-1.2 0-2 .8-2 2v6c0 1.2.8 2 2 2h3"/></svg>',
};
let history = [], busy = false, stats = null, controller = null;

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };
const nearBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
const scrollDown = smooth => window.scrollTo({ top: document.body.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

function welcome() {
  const w = el('section', 'welcome');
  const badge = el('div', 'badge', '<i></i><span>Live</span>');
  if (stats) badge.lastChild.textContent = `Up to date through ${fmtDate(stats.latest)}`;
  const h = el('h1', '', 'Make it quick.<br>He’s <em>very</em> busy.');
  const p = el('p');
  p.textContent = stats
    ? `Built from ${(stats.spoken + stats.posts).toLocaleString()} of his real speeches, interviews and posts.`
    : 'Built from tens of thousands of his real speeches, interviews and posts.';
  const cards = el('div', 'cards');
  for (const [title, prompt] of SUGGESTIONS) {
    const c = el('button', 'card');
    c.type = 'button';
    c.append(el('b'), el('span'));
    c.firstChild.textContent = title;
    c.lastChild.textContent = prompt;
    c.onclick = () => submit(prompt);
    cards.append(c);
  }
  w.append(badge, h, p, cards);
  return w;
}

// Renders text as paragraphs on blank lines, without interpreting HTML.
function render(node, text) {
  node.replaceChildren(...text.split(/\n{2,}/).map(t => { const p = el('p'); p.textContent = t; return p; }));
}

function addUser(text) {
  const t = el('div', 'turn user');
  const b = el('div', 'bubble');
  b.textContent = text;
  t.append(b);
  chat.append(t);
}

function addBot() {
  const t = el('div', 'turn bot', '<span class="seal">T</span><div class="body"><div class="text"><span class="dots"><i></i><i></i><i></i></span></div></div>');
  chat.append(t);
  return { body: t.querySelector('.body'), text: t.querySelector('.text') };
}

function addActions(body, reply, sources) {
  const row = el('div', 'actions');
  const copy = el('button', 'act', ICONS.copy + '<span>Copy</span>');
  copy.type = 'button';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(reply); } catch { return; }
    copy.innerHTML = ICONS.check + '<span>Copied</span>';
    setTimeout(() => { copy.innerHTML = ICONS.copy + '<span>Copy</span>'; }, 1600);
  };
  const retry = el('button', 'act retry', ICONS.retry + '<span>Retry</span>');
  retry.type = 'button';
  retry.onclick = regenerate;
  row.append(copy, retry);
  if (sources?.length) {
    const list = el('div', 'sources');
    for (const x of sources) {
      const s = el('div', 'src');
      const kind = x.g === 'truth' ? 'Truth Social' : x.g === 'tweet' ? 'Twitter' : x.g;
      s.append(el('small'), document.createTextNode(`“${x.t}${x.t.length >= 280 ? '…' : ''}”`));
      s.firstChild.textContent = `${kind} · ${fmtDate(x.d)}`;
      list.append(s);
    }
    const btn = el('button', 'act', ICONS.quote + '<span>Real quotes</span>');
    btn.type = 'button';
    btn.onclick = () => list.classList.toggle('open');
    row.append(btn);
    body.append(row, list);
  } else body.append(row);
}

function setBusy(on) {
  busy = on;
  sendBtn.classList.toggle('busy', on);
  sendBtn.setAttribute('aria-label', on ? 'Stop' : 'Send');
  resize();
}

function resize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  sendBtn.disabled = !busy && !input.value.trim();
}

function reset() {
  controller?.abort();
  history = [];
  chat.replaceChildren(welcome());
  input.value = '';
  resize();
  window.scrollTo({ top: 0 });
}

// Only the latest reply can be retried.
function regenerate() {
  if (busy || history.at(-1)?.role !== 'assistant') return;
  history.pop();
  chat.lastElementChild.remove();
  run();
}

function submit(text) {
  text = text.trim();
  if (!text || busy) return;
  input.value = '';
  if (!history.length) chat.replaceChildren();
  chat.querySelectorAll('.retry').forEach(r => r.remove());
  addUser(text);
  history.push({ role: 'user', content: text });
  run();
}

async function run() {
  setBusy(true);
  const { body, text } = addBot();
  scrollDown(true);
  let reply = '', sources = null;
  controller = new AbortController();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-30) }),
      signal: controller.signal,
    });
    if (!res.ok) throw Error((await res.json().catch(() => ({}))).error || 'Something went wrong. Try again.');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl));
        buf = buf.slice(nl + 1);
        if (msg.sources) sources = msg.sources;
        if (msg.error) throw Error(msg.error);
        if (msg.d) {
          const stick = nearBottom();
          reply += msg.d;
          render(text, reply);
          text.classList.add('caret');
          if (stick) scrollDown();
        }
      }
    }
    if (!reply) throw Error('No reply. Try again.');
  } catch (err) {
    if (!reply) text.replaceChildren();
    if (err.name !== 'AbortError') {
      const e = el('div', 'error');
      e.textContent = err.message;
      text.after(e);
    }
  } finally {
    text.classList.remove('caret');
    controller = null;
    if (reply) {
      history.push({ role: 'assistant', content: reply });
      addActions(body, reply, sources);
    } else {
      history.pop();
      const turn = body.closest('.turn');
      if (!body.querySelector('.error')) { turn.previousElementSibling?.remove(); turn.remove(); }
    }
    setBusy(false);
  }
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) controller?.abort();
  else submit(input.value);
});
input.addEventListener('keydown', e => {
  // Enter sends on desktop; on phones the return key adds a new line.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer:coarse)').matches) {
    e.preventDefault();
    if (!busy) submit(input.value);
  }
});
input.addEventListener('input', resize);
$('reset').addEventListener('click', reset);
$('jump').addEventListener('click', () => scrollDown(true));
window.addEventListener('scroll', () => {
  $('top').classList.toggle('scrolled', window.scrollY > 4);
  $('jump').classList.toggle('show', history.length > 0 && !nearBottom());
}, { passive: true });

fetch('/api/status').then(r => r.json()).then(s => {
  stats = s.corpus;
  if (!history.length && !busy) chat.replaceChildren(welcome());
}).catch(() => {});
reset();
</script>
</body>
</html>
